<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golf Go Next</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#fff6dc;--panel:rgba(15,34,51,.72)}
  html,body{margin:0;height:100%;background:#0f2233;color:var(--ink);font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));background:var(--panel);padding:8px 10px;border-radius:10px;max-width:min(320px,calc(100vw - 20px));pointer-events:auto}
  #hud b{font-weight:650}
  #hud .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  #hud button,#hud a{font:inherit;color:var(--ink);background:rgba(255,255,255,.12);border:0;border-radius:7px;padding:4px 8px;text-decoration:none;cursor:pointer}
  #hud button:active{background:rgba(255,255,255,.25)}
  #stats{font-variant-numeric:tabular-nums;opacity:.9}
  [hidden]{display:none!important}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.webgpu.min.js","three/tsl":"./vendor/three.webgpu.min.js","three/addons/":"./vendor/addons/"}}
</script>
</head>
<body>
<div id="msg">Loading…</div>
<div id="hud" hidden>
  <div><b id="title">Golf Go Next</b> <span style="opacity:.7">· prototype</span></div>
  <div id="stats"></div>
  <div class="row">
    <button data-view="tee">Tee</button><button data-view="green">Green</button><button data-view="above">Above</button>
    <a href="../">Current game</a>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
