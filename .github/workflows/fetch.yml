name: course-data
on:
  workflow_dispatch:
  push:
    paths: ['lidar job.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pd
          create-args: -c conda-forge python=3.11 pdal python-pdal numpy requests pyproj
          init-shell: bash
      - name: fetch
        shell: bash -el {0}
        run: |
          set -o pipefail
          python "lidar job.py" 2>&1 | tee run.log
      - name: save
        if: always()
        run: |
          mkdir -p /tmp/o
          cp -r out/. /tmp/o/ || true
          cp run.log /tmp/o/ || true
          cd /tmp/o
          git init -q -b course-data
          git add -A
          git -c user.name=lidar-bot -c user.email=lidar-bot@users.noreply.github.com commit -qm "course data run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" course-data
