name: Deploy Ask function
# Deploys supabase/functions/ask to the Golf Go Supabase project and sets its Anthropic key.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  (Supabase > Account > Access Tokens)
#   ANTHROPIC_API_KEY      (console.anthropic.com > API Keys)
on:
  push:
    paths: ["supabase/functions/ask/**", ".github/workflows/ask.yml", "ask deploy.txt"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROJECT_REF: rgzpfjstfgygqdfmiqdh
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN secret is missing - skipping deploy"; echo "SKIP=1" >> $GITHUB_ENV; fi
      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: latest
      - name: Set Anthropic key
        if: env.SKIP != '1'
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"; else echo "::warning::ANTHROPIC_API_KEY secret is missing"; fi
      - name: Deploy function
        if: env.SKIP != '1'
        run: supabase functions deploy ask --project-ref "$PROJECT_REF" --use-api
