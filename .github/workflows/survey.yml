name: course-survey
on:
  workflow_dispatch:
  push:
    paths: ['pipeline/survey/**']
permissions:
  contents: write
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install -q requests numpy matplotlib tifffile
      - name: survey
        run: python pipeline/survey/survey.py 2>&1 | tee run.log
      - name: save
        if: always()
        run: |
          mkdir -p /tmp/o
          cp -r out/survey/. /tmp/o/ || true
          cp run.log /tmp/o/ || true
          cd /tmp/o
          git init -q -b survey-data
          git add -A
          git -c user.name=survey-bot -c user.email=survey-bot@users.noreply.github.com commit -qm "course survey run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" survey-data
