name: all-clubs
on:
  push:
    paths: ['club_job.py', 'clubs.json']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pd
          create-args: -c conda-forge python=3.11 pdal python-pdal numpy requests pyproj shapely
          init-shell: bash
      - name: fetch
        shell: bash -el {0}
        run: python club_job.py 2>&1 | tee run.log
      - name: save
        if: always()
        run: |
          mkdir -p /tmp/o; cp -r out/. /tmp/o/ || true; cp run.log /tmp/o/ || true
          cd /tmp/o; git init -q -b all-clubs-data; git add -A
          git -c user.name=lidar-bot -c user.email=lidar-bot@users.noreply.github.com commit -qm "all clubs run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" all-clubs-data
