name: measured-bunkers
# Sand colour and edge shape for every mapped bunker, one job per course (pipeline/courses/bunkers/bunker_all.py).
# Push pipeline/courses/bunkers/only.json (["key", ...], or [] for all) to the bunkers-all branch, or run by hand.
# Results go to the bunkers-data branch: <key>/bunkers.json, summary.json, prev.jpg, run.log.
on:
  workflow_dispatch:
  push:
    branches: [bunkers-all]
    paths: ['pipeline/courses/bunkers/only.json', 'pipeline/courses/bunkers/bunker_all.py']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.k.outputs.keys }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        run: echo "keys=$(python3 -c "import json,os;c=json.load(open('pipeline/courses/treelidar/cfg_trees.json'));p='pipeline/courses/bunkers/only.json';o=json.load(open(p)) if os.path.exists(p) else [];print(json.dumps([k for k in c if not o or k in o]))")" >> $GITHUB_OUTPUT
  course:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        key: ${{ fromJson(needs.plan.outputs.keys) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline/courses/treelidar
            pipeline/courses/bunkers
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pd
          create-args: -c conda-forge python=3.11 pdal python-pdal numpy scipy scikit-image opencv pyproj requests
          init-shell: bash
          cache-environment: true
      - name: measure
        shell: bash -el {0}
        run: |
          set -o pipefail
          python pipeline/courses/bunkers/bunker_all.py ${{ matrix.key }} pipeline/courses/treelidar/cfg_trees.json 2>&1 | tee run.log
          mkdir -p out/${{ matrix.key }} && cp run.log out/${{ matrix.key }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b-${{ matrix.key }}
          path: out/${{ matrix.key }}
  collect:
    needs: course
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/o
          pattern: b-*
      - name: push
        run: |
          cd /tmp/o
          for d in b-*; do mv "$d" "${d#b-}"; done
          git init -q -b bunkers-data
          git add -A
          git -c user.name=bunker-bot -c user.email=bunker-bot@users.noreply.github.com commit -qm "measured bunkers run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" bunkers-data
