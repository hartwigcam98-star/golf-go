name: iPhone app to TestFlight
# Builds the Golf Go iPhone app (app/, Capacitor) on a GitHub Mac and uploads it to App Store Connect for TestFlight.
# Run it from the Actions tab (Run workflow). Needs these repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID    the 10-character Team ID (developer.apple.com > Account > Membership details)
#   ASC_KEY_ID       App Store Connect API key ID
#   ASC_ISSUER_ID    App Store Connect API issuer ID
#   ASC_KEY_P8       the whole .p8 key file, including the BEGIN/END lines
# Signing is automatic: Xcode creates the certificate and profile through the API key (the key needs the Admin role).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in TestFlight (e.g. 1.0)
        required: false
        default: "1.0"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in T K I P; do if [ -z "${!v}" ]; then echo "::error::Missing secret (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 are all needed)"; exit 1; fi; done
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Web files and native project
        working-directory: app
        run: |
          npm ci
          npm run sync
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KID.p8"
      # Archived unsigned: automatic signing at archive time wants a development profile, and that needs a registered iPhone
      # ("Your team has no devices"). The export below signs it for the App Store through the API key (cloud signing, no device).
      # Does the key work, and does App Store Connect have an app with this bundle ID? (prints only statuses and the app's name)
      - name: Check the key and the app
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install -q --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install -q pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt
          kid, iss = os.environ['KID'].strip(), os.environ['ISS'].strip()
          key = open(f"{os.environ['RUNNER_TEMP']}/keys/AuthKey_{os.environ['KID']}.p8").read()
          print('key id length', len(kid), '| issuer id length', len(iss), '| key file lines', len(key.strip().splitlines()))
          tok = jwt.encode({'iss': iss, 'iat': int(time.time()), 'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': kid, 'typ': 'JWT'})
          def get(u):
              r = urllib.request.Request('https://api.appstoreconnect.apple.com' + u, headers={'Authorization': 'Bearer ' + tok})
              try:
                  with urllib.request.urlopen(r) as f: return f.status, json.load(f)
              except urllib.error.HTTPError as e: return e.code, json.loads(e.read() or b'{}')
          st, j = get('/v1/apps?limit=50&fields[apps]=name,bundleId')
          print('list apps: HTTP', st)
          if st != 200: print('::error::App Store Connect refused the key:', [x.get('title', '') + ': ' + x.get('detail', '') for x in j.get('errors', [])])
          else:
              apps = [(a['attributes']['name'], a['attributes']['bundleId']) for a in j['data']]
              print('apps on the account:', apps)
              if not any(b == 'io.github.hartwigcam98.golfgo' for _, b in apps): print('::error::No App Store Connect app with bundle ID io.github.hartwigcam98.golfgo')
          PY
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project app/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KID.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          rc=0
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KID.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" || rc=$?
          if [ $rc -ne 0 ]; then for f in $(ls -d "${TMPDIR:-/tmp}"/App_*.xcdistributionlogs 2>/dev/null); do echo "== $f"; grep -h -i -E "error|fail|denied|forbidden|not found|status" "$f"/*.log 2>/dev/null | tail -40; done; exit $rc; fi
          echo "::notice::Uploaded build ${{ github.run_number }} (version ${{ inputs.version }}). It shows in TestFlight after Apple's processing (usually 5-30 min)."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
