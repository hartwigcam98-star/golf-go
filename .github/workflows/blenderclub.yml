name: blender-club
on:
  push:
    branches: [blender-club]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.p.outputs.m }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          if [ -f matrix.json ]; then echo "m=$(cat matrix.json)" >> $GITHUB_OUTPUT; else echo 'm=["job"]' >> $GITHUB_OUTPUT; fi
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libxfixes3 libgl1 libegl1 > /dev/null
      - name: blender
        run: |
          BV=$(curl -s https://download.blender.org/release/Blender4.2/ | grep -o 'blender-4\.2\.[0-9]*-linux-x64\.tar\.xz' | sort -V | tail -1)
          curl -sL "https://download.blender.org/release/Blender4.2/$BV" -o /tmp/b.tar.xz && mkdir -p /tmp/blender && tar xf /tmp/b.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | head -1
      - name: build
        run: |
          IT="${{ matrix.item }}"
          if [ "$IT" = job ]; then bash job.sh; else
            H=${IT%%:*}; PART=${IT##*:}; mkdir -p out
            BAKE_ONLY=$PART SH_SAMPLES=128 SKY_SAMPLES=64 /tmp/blender/blender -b --factory-startup -P bake.py -- holes/$H.npz atlas2.png out/$H 4 2>&1 | tee out/$H-$PART.log | grep -E "\[bake\]|Error|Traceback" | tail -20
          fi
      - name: save
        if: always()
        run: |
          IT="${{ matrix.item }}"
          if [ "$IT" = job ]; then BR=$(cat $GITHUB_WORKSPACE/outbranch.txt 2>/dev/null || echo blender-club-data); else BR="bake-${IT/:/-}"; fi
          mkdir -p /tmp/o && cp -r out/. /tmp/o/ || true
          cd /tmp/o && git init -q -b $BR && git add -A
          git -c user.name=club-bot -c user.email=club-bot@users.noreply.github.com commit -qm "blender run $GITHUB_RUN_ID $IT"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" $BR
