name: Unity test to TestFlight
# The one-hole Unity test (unity/): Unity builds the Xcode project on GitHub's Mac, then it is archived unsigned and signed for
# the App Store at export (same as the web-wrapper app, testflight.yml). It goes to the same App Store Connect app (GolfGo Tour,
# bundle ID Golfgo) as version 2.0, so it shows in TestFlight next to the 1.0 builds.
# Secrets: UNITY_EMAIL, UNITY_PASSWORD (a free Unity Personal account) plus the four Apple ones testflight.yml uses.
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version for this build
        default: '2.0'
permissions:
  contents: write   # (only to hand the one-time Unity sign-in link over on the unity-signin branch)
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          E: ${{ secrets.UNITY_EMAIL }}
          W: ${{ secrets.UNITY_PASSWORD }}
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in E W T K I P; do if [ -z "${!v}" ]; then echo "::error::Missing secret ($v): UNITY_EMAIL, UNITY_PASSWORD and the four Apple secrets are all needed"; exit 1; fi; done
      # Unity's own standalone CLI installs the editor (the Unity Hub based actions broke when Hub dropped its 'editors' command)
      - name: Install Unity
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          for d in "$HOME/.local/bin" "$HOME/.unity/bin" /usr/local/bin /opt/homebrew/bin; do [ -x "$d/unity" ] && echo "$d" >> "$GITHUB_PATH" && export PATH="$d:$PATH"; done
          unity --version
          export UNITY_NON_INTERACTIVE=1 UNITY_NO_UPDATE_CHECK=1
          unity install lts -m ios --non-interactive 2>&1 | tail -20
          unity editors -i --format json > editors.json
          V=$(python3 -c "import json;d=json.load(open('editors.json'))['data']['items'];print(sorted(e['version'] for e in d)[-1])")
          ED=$(python3 -c "import json;d=json.load(open('editors.json'))['data']['items'];print(sorted(d,key=lambda e:e['version'])[-1]['location'])")
          case "$ED" in *.app) ED="$ED/Contents/MacOS/Unity";; esac
          [ -x "$ED" ] || ED=$(ls -d /Applications/Unity/Hub/Editor/*/Unity.app/Contents/MacOS/Unity "$HOME"/Applications/Unity/Hub/Editor/*/Unity.app/Contents/MacOS/Unity 2>/dev/null | sort -V | tail -1)
          echo "version $V  editor $ED"; test -x "$ED"
          echo "UNITY_EDITOR_PATH=$ED" >> "$GITHUB_ENV"
          printf 'm_EditorVersion: %s\n' "$V" > unity/ProjectSettings/ProjectVersion.txt
          unity license --help 2>&1 | head -40 || true
      # The free Personal seat can only be claimed by a signed-in Unity account (not a service account, and not with the
      # password alone). Unity's CLI prints a sign-in link for headless machines: it is pushed to the unity-signin branch,
      # the owner opens it on his phone, and the seat is claimed here. Later runs may already find the seat (then no link).
      - name: Activate the Personal licence
        env:
          E: ${{ secrets.UNITY_EMAIL }}
          W: ${{ secrets.UNITY_PASSWORD }}
        run: |
          "$UNITY_EDITOR_PATH" -batchmode -quit -nographics -username "$E" -password "$W" -logFile - 2>&1 | grep -E "Licensing::(Client|Module)\] (Success|Error)" | grep -v -i password | sort -u | head -8 || true
          if unity license status 2>&1 | grep -q -i "none active"; then
            # Unity's sign-in link times out after a few minutes: hand over a fresh one each time, up to 5 (about 25 minutes)
            mkdir -p "$RUNNER_TEMP/s" && (cd "$RUNNER_TEMP/s" && git init -q)
            for n in 1 2 3 4 5; do
              : > "$RUNNER_TEMP/login.txt"; unity auth login --insecure-storage > "$RUNNER_TEMP/login.txt" 2>&1 & LP=$!
              for i in $(seq 1 20); do URL=$(grep -o 'https://services.api.unity.com[^ ]*' "$RUNNER_TEMP/login.txt" | head -1); [ -n "$URL" ] && break; sleep 2; done
              (cd "$RUNNER_TEMP/s" && printf '%s\n%s attempt %s\n' "$URL" "$(date -u +%FT%TZ)" "$n" > url.txt && git add url.txt \
                && git -c user.name=unity-bot -c user.email=unity-bot@users.noreply.github.com commit -qm "Unity sign-in link (run $GITHUB_RUN_ID, $n)" \
                && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/unity-signin)
              echo "::notice::Unity sign-in link $n is on the unity-signin branch"
              while kill -0 $LP 2>/dev/null; do sleep 3; done
              tail -3 "$RUNNER_TEMP/login.txt"
              unity auth status 2>&1 | grep -q -i "not signed in" || break
            done
            unity auth status 2>&1 | tail -3
            unity license activate --personal --accept-eula --non-interactive 2>&1 | tail -8
          fi
          unity license status 2>&1 | tail -6
      # the web game's two Google Fonts (SIL Open Font Licence), for the HUD (Hud.cs loads them from Resources/Fonts)
      - name: Fonts
        run: |
          mkdir -p unity/Assets/Resources/Fonts
          for f in lilitaone/LilitaOne-Regular.ttf barlowsemicondensed/BarlowSemiCondensed-Medium.ttf barlowsemicondensed/BarlowSemiCondensed-Bold.ttf barlowsemicondensed/OFL.txt; do
            curl -fsSL -o "unity/Assets/Resources/Fonts/$(basename $f)" "https://raw.githubusercontent.com/google/fonts/main/ofl/$f" || echo "::warning::font $f not fetched (the HUD falls back to the built-in font)"
          done
          ls -la unity/Assets/Resources/Fonts
      # The look check: the same scene as a Mac player on this Mac, pictures of a few holes (HoleTest.Shots) with the on-screen
      # readout, uploaded as the look-shots artifact before the iPhone build starts (nothing here can stop the iPhone build)
      - name: Look check (Mac player pictures)
        continue-on-error: true
        timeout-minutes: 35
        run: |
          mkdir -p shots
          "$UNITY_EDITOR_PATH" -batchmode -quit -nographics -projectPath "$GITHUB_WORKSPACE/unity" -buildTarget StandaloneOSX \
            -executeMethod GolfGoBuild.BuildMacShots -logFile - 2>&1 | tee shots/mac-build.log | grep -E "GolfGoBuild|error CS|Shader error|Exception" | head -60
          APP=unity/build/mac/GolfGo.app; BIN=$(ls "$APP"/Contents/MacOS/* 2>/dev/null | head -1); echo "player: $BIN"; test -n "$BIN"
          system_profiler SPDisplaysDataType 2>/dev/null | head -20 || true
          "$BIN" -ggshots "$GITHUB_WORKSPACE/shots" -screen-width 590 -screen-height 1278 -screen-fullscreen 0 -logFile "$GITHUB_WORKSPACE/shots/player.log" & P=$!
          for i in $(seq 1 120); do kill -0 $P 2>/dev/null || break; sleep 2; done; kill $P 2>/dev/null || true
          grep -E "GGSHOT|Error|Exception|Metal|GfxDevice" shots/player.log | head -60 || true; ls -la shots
          # (also onto the unity-shots branch: artifact downloads come from a storage host Claude's sessions can't reach)
          mkdir -p "$RUNNER_TEMP/sh" && cp shots/*.png shots/*.log "$RUNNER_TEMP/sh/" 2>/dev/null; cd "$RUNNER_TEMP/sh" && git init -q && git add -A \
            && git -c user.name=unity-bot -c user.email=unity-bot@users.noreply.github.com commit -qm "Look check pictures (run $GITHUB_RUN_ID)" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/unity-shots && echo "pictures on unity-shots"
      - name: Upload the look pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: look-shots
          path: shots
          if-no-files-found: warn
      - name: Unity build (Xcode project)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "editor: $UNITY_EDITOR_PATH"
          "$UNITY_EDITOR_PATH" -batchmode -quit -nographics -projectPath "$GITHUB_WORKSPACE/unity" -buildTarget iOS \
            -executeMethod GolfGoBuild.BuildIOS -logFile - 2>&1 | tee unity.log | grep -E "error|Error|GolfGoBuild|Exception|warning CS" | head -200
          test -d unity/build/iOS/Unity-iPhone.xcodeproj || { echo "::error::Unity did not write the Xcode project (see the log above)"; tail -80 unity.log; exit 1; }
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KID.p8"
      - name: Archive (unsigned; signed at export)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project unity/build/iOS/Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          test -d "$RUNNER_TEMP/App.xcarchive" || exit 1
      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KID.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          echo "::notice::Uploaded the Unity test, version ${{ inputs.version }} build ${{ github.run_number }}. It shows in TestFlight after Apple's processing."
      - name: Remove the key and return the licence
        if: always()
        env:
          E: ${{ secrets.UNITY_EMAIL }}
          W: ${{ secrets.UNITY_PASSWORD }}
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          [ -n "$UNITY_EDITOR_PATH" ] && "$UNITY_EDITOR_PATH" -batchmode -quit -nographics -returnlicense -username "$E" -password "$W" -logFile - 2>&1 | grep -i -E "licen|return" | grep -v -i password | head -10 || true
